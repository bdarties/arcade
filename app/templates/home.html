<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade - Accueil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="background"></div>
    <div class="container-accueil">
        <div class="buttons-container">
            <a href="{{ url_for('routes.games_list') }}" class="nav-button focused" data-href="{{ url_for('routes.games_list') }}">
                COMMENCER
            </a>
            <a href="{{ url_for('routes.about') }}" class="nav-button" data-href="{{ url_for('routes.about') }}">
                À PROPOS / CRÉDITS
            </a>
        </div>
    </div>

    <a href="#" class="nav-button power-button" data-action="shutdown">
        ÉTEINDRE
    </a>

    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <p>Voulez-vous éteindre la borne ?</p>
            <div class="confirm-actions">
                <span class="confirm-btn focused" id="confirm-cancel">ANNULER</span>
                <span class="confirm-btn" id="confirm-ok">ÉTEINDRE</span>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.nav-button');
        let currentFocus = 0;

        const confirmOverlay = document.getElementById('confirm-overlay');
        const confirmCancelBtn = document.getElementById('confirm-cancel');
        const confirmOkBtn = document.getElementById('confirm-ok');
        let confirmOpen = false;
        let confirmChoice = 'cancel';

        function updateFocus() {
            buttons.forEach((btn, index) => {
                if (index === currentFocus) {
                    btn.classList.add('focused');
                } else {
                    btn.classList.remove('focused');
                }
            });
        }

        function updateConfirmFocus() {
            confirmCancelBtn.classList.toggle('focused', confirmChoice === 'cancel');
            confirmOkBtn.classList.toggle('focused', confirmChoice === 'ok');
        }

        function openConfirm() {
            confirmOpen = true;
            confirmChoice = 'cancel';
            updateConfirmFocus();
            confirmOverlay.classList.add('visible');
        }

        function closeConfirm() {
            confirmOpen = false;
            confirmOverlay.classList.remove('visible');
        }

        function requestShutdown() {
            fetch("{{ url_for('routes.shutdown') }}", { method: 'POST' }).catch(() => {});
            confirmOkBtn.textContent = 'EXTINCTION...';
        }

        function activateButton(button) {
            if (!button) return;
            if (button.dataset.action === 'shutdown') {
                openConfirm();
            } else {
                window.location.href = button.dataset.href;
            }
        }

        confirmCancelBtn.addEventListener('click', closeConfirm);
        confirmOkBtn.addEventListener('click', requestShutdown);
        buttons.forEach((btn) => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                activateButton(btn);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (confirmOpen) {
                switch (e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        confirmChoice = 'cancel';
                        updateConfirmFocus();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        confirmChoice = 'ok';
                        updateConfirmFocus();
                        break;
                    case 'x':
                    case 'X':
                        e.preventDefault();
                        if (confirmChoice === 'ok') {
                            requestShutdown();
                        } else {
                            closeConfirm();
                        }
                        break;
                    case 'Escape':
                        e.preventDefault();
                        closeConfirm();
                        break;
                }
                return;
            }

            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    currentFocus = Math.max(0, currentFocus - 1);
                    updateFocus();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    currentFocus = Math.min(buttons.length - 1, currentFocus + 1);
                    updateFocus();
                    break;
                case 'x':
                case 'X':
                    e.preventDefault();
                    activateButton(buttons[currentFocus]);
                    break;
            }
        });
    </script>
</body>
</html>
